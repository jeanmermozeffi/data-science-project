<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="940" height="400" rx="14" fill="#fcfcfb"/>
<defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text x="470.0" y="36.0" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Le cycle d'un modèle mis au service du métier, de A à Z</text>
<rect x="40" y="66" width="190" height="92" rx="10" fill="#f3f2ee" stroke="#c3c2b7" stroke-width="2"/>
<text x="135.0" y="92.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">① Cadrer</text>
<text x="135.0" y="112.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">avec le métier :</text>
<text x="135.0" y="129.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">besoin, décisions, risques</text>
<line x1="232" y1="112.0" x2="268" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="270" y="66" width="190" height="92" rx="10" fill="#e6eef9" stroke="#1c5cab" stroke-width="2"/>
<text x="365.0" y="92.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">② Données</text>
<text x="365.0" y="112.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">explorer, nettoyer,</text>
<text x="365.0" y="129.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">choisir les variables</text>
<line x1="462" y1="112.0" x2="498" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="500" y="66" width="190" height="92" rx="10" fill="#e6eef9" stroke="#1c5cab" stroke-width="2"/>
<text x="595.0" y="92.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">③ Modèle</text>
<text x="595.0" y="112.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">entraîner, évaluer,</text>
<text x="595.0" y="129.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">choisir les seuils</text>
<line x1="692" y1="112.0" x2="728" y2="112.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="730" y="66" width="190" height="92" rx="10" fill="#e6eef9" stroke="#1c5cab" stroke-width="2"/>
<text x="825.0" y="92.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">④ Enregistrer</text>
<text x="825.0" y="112.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">modèle (.joblib)</text>
<text x="825.0" y="129.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">+ fiche du modèle</text>
<rect x="730" y="236" width="190" height="92" rx="10" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="825.0" y="262.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">⑤ Application</text>
<text x="825.0" y="282.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">interface Streamlit,</text>
<text x="825.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">logique métier séparée</text>
<line x1="728" y1="282.0" x2="692" y2="282.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="500" y="236" width="190" height="92" rx="10" fill="#e3f6ee" stroke="#14875e" stroke-width="2"/>
<text x="595.0" y="262.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">⑥ Tester</text>
<text x="595.0" y="282.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">pytest + AppTest,</text>
<text x="595.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">essai avec un agent</text>
<line x1="498" y1="282.0" x2="462" y2="282.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="270" y="236" width="190" height="92" rx="10" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="365.0" y="262.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">⑦ Déployer</text>
<text x="365.0" y="282.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">serveur, accès,</text>
<text x="365.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">versions figées</text>
<line x1="268" y1="282.0" x2="232" y2="282.0" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<rect x="40" y="236" width="190" height="92" rx="10" fill="#fde7dc" stroke="#d4581f" stroke-width="2"/>
<text x="135.0" y="262.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="bold">⑧ Suivre</text>
<text x="135.0" y="282.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">journal, dérive,</text>
<text x="135.0" y="299.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">réentraînement</text>
<line x1="825.0" y1="160" x2="825.0" y2="234" stroke="#52514e" stroke-width="2" marker-end="url(#fl)"/>
<path d="M 150 234 C 170 200, 250 190, 318 162" fill="none" stroke="#d4581f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<text x="236.0" y="190.0" font-size="11" fill="#d4581f" text-anchor="start" font-weight="bold">réentraîner</text>
<text x="470.0" y="356.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal">⟲ Le suivi en production renvoie aux étapes ② et ③ : nouvelles données, nouveau modèle, nouvelle version</text>
<rect x="170" y="372" width="14" height="14" rx="3" fill="#e6eef9" stroke="#1c5cab" stroke-width="1.5"/>
<text x="190.0" y="384.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">data science (modules précédents)</text>
<rect x="421.79999999999995" y="372" width="14" height="14" rx="3" fill="#e3f6ee" stroke="#14875e" stroke-width="1.5"/>
<text x="441.8" y="384.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">application (ce cours)</text>
<rect x="601.0" y="372" width="14" height="14" rx="3" fill="#fde7dc" stroke="#d4581f" stroke-width="1.5"/>
<text x="621.0" y="384.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal">mise en production (ce cours)</text>
