<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkiText — Gestion de boutiques textiles</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Bienvenue sur AkiText</h1>
    <div>
        <p>Bienvenue dans votre espace de gestion de boutique textile !</p>
        <p>Commencez par ajouter vos produits ou gérer vos commandes.</p>
    </div>
    <div>
        <a href="https://www.youtube.com" target="_blank" >YouTube</a>
    </div>
    <div>
        <b>Je suis un text en gras</b> <br>
        <i>Je suis un text en italique</i>
    </div>
    <div>
        <table border="1">
            <tr>
                <th>Nom du produit</th>
                <th>Prix</th>
                <th>Quantité</th>
            </tr>
            <tr>
                <td>T-shirt</td>
                <td class="price" id="price-tshirt">15€</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Jeans</td>
                <td class="price" id="price-jeans">40€</td>
                <td>30</td>
            </tr>
            <tr>
                <td>Veste</td>
                <td class="price" id="price-veste">60€</td>
                <td>20</td>
            </tr>
        </table>
    </div>
</body>
</html>
